<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hard Sixteen</title>
<meta name="description" content="Drill blackjack basic strategy with the win, push and lose odds behind every play.">
<meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Hard Sixteen">
<meta property="og:description" content="Drill blackjack basic strategy with the win, push and lose odds behind every play.">
<meta property="og:image" content="icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hard Sixteen">
<meta name="twitter:description" content="Drill blackjack basic strategy with the win, push and lose odds behind every play.">
<meta name="twitter:image" content="icons/og.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hard Sixteen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<!-- #region app-markup -->
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">16</span>
      <span class="brand-name">Hard Sixteen</span>
    </div>
    <span class="topbar-spacer"></span>
    <button class="rules-chip" id="rulesChip" type="button" title="Table rules in play">6D · S17</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Change theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/></svg>
    </button>
  </header>

  <main class="pane" id="pane">
    <section class="pane-inner" id="view-drill" role="tabpanel" aria-label="Drill">
      <div class="strip" id="strip"></div>
      <div class="bankbar" id="bankbar" hidden></div>
      <div class="segs" id="modes" role="group" aria-label="Drill style"></div>
      <div class="panel felt" id="felt"></div>
      <div id="answer"></div>
    </section>

    <section class="pane-inner" id="view-chart" role="tabpanel" aria-label="Chart" hidden>
      <div id="chartHost"></div>
    </section>

    <section class="pane-inner" id="view-stats" role="tabpanel" aria-label="Progress" hidden>
      <div id="statsHost"></div>
    </section>

    <section class="pane-inner" id="view-settings" role="tabpanel" aria-label="Settings" hidden>
      <div id="settingsHost"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-view="drill" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.2" y="5" width="11" height="15" rx="2"/><path d="M8.2 14.5 11 10l2.8 4.5z" fill="currentColor" stroke="none"/><path d="M16.6 6.6 20 7.6a1.6 1.6 0 0 1 1.1 2L18.4 19"/></svg>
      <span>Drill</span><span class="tab-dot"></span>
    </button>
    <button class="tab" role="tab" data-view="chart" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.4" y="3.4" width="17.2" height="17.2" rx="2.4"/><path d="M3.4 9.2h17.2M3.4 15h17.2M9.2 3.4v17.2M15 3.4v17.2"/></svg>
      <span>Chart</span><span class="tab-dot"></span>
    </button>
    <button class="tab" role="tab" data-view="stats" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V11M10 20V4.5M16 20v-6M22 20H2"/></svg>
      <span>Progress</span><span class="tab-dot"></span>
    </button>
    <button class="tab" role="tab" data-view="settings" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 7.6l2 1.2M17.5 15.2l2 1.2M4.5 16.4l2-1.2M17.5 8.8l2-1.2"/></svg>
      <span>Settings</span><span class="tab-dot"></span>
    </button>
  </nav>
</div>
<div id="sheetRoot"></div>
<!-- #endregion app-markup -->
<script type="module" src="src/app/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
