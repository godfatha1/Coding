[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "likesync"
version = "1.0.0"
description = "Two-way daily sync between Spotify and SoundCloud liked songs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# No runtime dependencies on purpose: this runs unattended from cron for years,
# and a dependency resolution failure at 04:00 is worse than a little more code.
dependencies = []

[project.optional-dependencies]
# Only needed to encrypt the token file at rest (CI / shared hosts).
crypt = ["cryptography>=42"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
likesync = "likesync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests unpack provider triples and keep only the handles they assert on.
"tests/*" = ["RUF059"]
